server:

jwt:
  secret: "SnapTradeSuperSecretKeyForJwtAuthenticationWhichIsVeryLong2026!"
  access-expiration: 3600000

simulation:
  trade-interval-ms: 100

spring:
  application:
    name: snaptrade

  threads:
    virtual:
      enabled: true

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:mysql://localhost:3306/snap_trade?serverTimezone=Asia/Seoul
    username: root
    password: root
    hikari:
      pool-name: SnapTradeHikariPool

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.project.snaptrade.*
        spring.json.use.type.headers: true
    listener:
      missing-topics-fatal: false

  jpa:
    hibernate:
      ddl-auto: create

    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

    defer-datasource-initialization: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: snaptrade-engine
      namespace: local